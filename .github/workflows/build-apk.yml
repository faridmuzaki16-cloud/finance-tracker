name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Buat proyek Android
        run: |
          mkdir build && cd build
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www && echo '<html><body>Memuat...</body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "io.github.faridmuzaki16.finance",
            "appName": "Finance Tracker",
            "webDir": "www",
            "server": {
              "url": "https://faridmuzaki16-cloud.github.io/finance-tracker/",
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round; do
              cp ../icons/icon-512.png $RES/mipmap-$d/$n.png
            done
          done
      - name: Build APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Terbitkan APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk FinanceTracker.apk
          gh release create "apk-${{ github.run_number }}" FinanceTracker.apk \
            --title "Finance Tracker APK #${{ github.run_number }}" \
            --notes "APK Finance Tracker. Isi aplikasi diperbarui otomatis dari situs."
